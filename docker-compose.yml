name: maple-sugar

services:
  db:
    # Pinned to a digest, not just the mutable `17-alpine` tag, so an upstream
    # repush can't silently change what gets pulled.
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_USER: maple
      POSTGRES_PASSWORD: maple
      POSTGRES_DB: maple_sugaring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple -d maple_sugaring"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  cache:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5

  api:
    build:
      context: ./Maple-Sugar-BE
    # This base file is the DEV stack (laptops). For local dev you only need to
    # supply the Google OAuth client: copy Maple-Sugar-BE/.env.example to
    # Maple-Sugar-BE/.env and fill in GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
    # (shared via the team password manager — GitHub Secrets cannot be read back
    # onto a laptop). JWT_SECRET can be left blank in dev: a throwaway default is
    # used when NODE_ENV is not production. For PROD on the RLES host, layer the
    # overlay, which injects real secrets from the host environment:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
    env_file:
      # Optional so the prod overlay (host-env secrets) can run without any file
      # on disk, and so a laptop missing .env fails with a clear config error
      # rather than a compose error.
      - path: ./Maple-Sugar-BE/.env
        required: false
    environment:
      # Dev by default; the prod overlay flips this to production.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://maple:maple@db:5432/maple_sugaring
      REDIS_URL: redis://cache:6379
      # Created if missing, then promoted to Admin with no expiry, on every API start.
      BOOTSTRAP_ADMIN_EMAILS: bda9885@g.rit.edu,nic4340@g.rit.edu,odg1896@g.rit.edu,bmm8699@g.rit.edu,ir8643@g.rit.edu,nlt8375@g.rit.edu,dy4385@g.rit.edu
      # Browser-facing URLs for this compose stack (nginx published on :8080).
      # Overridable from the host env; the prod overlay requires the real domain.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      # JWT_SECRET / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET come from
      # Maple-Sugar-BE/.env in dev, and from the host environment in prod (see
      # docker-compose.prod.yml).
    depends_on:
      db:
        condition: service_healthy
      # Not service_healthy: connectCache() already degrades to direct SQL
      # when Redis is slow or unreachable, so the API container shouldn't
      # refuse to start over a cache outage it's designed to tolerate.
      cache:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  web:
    build:
      context: ./Maple-Sugar-FE
      args:
        VITE_API_BASE_URL: /api
        VITE_API_MODE: http
    environment:
      API_UPSTREAM: http://api:3000
    depends_on:
      # service_healthy (not just "started") so nginx only starts fronting
      # traffic once the API has finished running migrations and is actually
      # answering /health, matching the db/cache dependency pattern above.
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres_data:
