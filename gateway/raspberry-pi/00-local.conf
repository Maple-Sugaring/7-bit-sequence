# If you would rather keep Ubuntu's stock sshd_config, put THIS
# file on the Pi as /etc/ssh/sshd_config.d/00-local.conf
# (00- so it is read before 50-cloud-init.conf; OpenSSH uses first match).
#
#   sudo cp 00-local.conf /etc/ssh/sshd_config.d/00-local.conf
#   sudo passwd ubuntu
#   sudo systemctl restart ssh

PasswordAuthentication yes
KbdInteractiveAuthentication yes
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
