name: Frontend CI

on:
  push:
    branches: [main, backend]
    paths:
      - "Maple-Sugar-FE/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "Maple-Sugar-FE/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  validate:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Maple-Sugar-FE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Maple-Sugar-FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
