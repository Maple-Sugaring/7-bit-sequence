name: Terraform EC2

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Infrastructure operation
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: maple-terraform-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform/bootstrap init -backend=false -input=false
      - run: terraform -chdir=terraform/bootstrap validate

  infrastructure:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize encrypted state and locking
        working-directory: terraform
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$STATE_BUCKET"
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - run: terraform -chdir=terraform plan -input=false -out=production.tfplan
      - if: inputs.operation == 'apply'
        run: terraform -chdir=terraform apply -input=false production.tfplan
      - run: terraform -chdir=terraform output
