# Versions are pinned so the image the web flasher serves can be rebuilt
# byte for byte. Bump them together and re-run scripts/publish-web-flasher.sh.
[node]
platform = espressif32@7.1.3
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
monitor_filters = time, colorize
lib_deps =
  jgromes/RadioLib@7.8.1
  olikraus/U8g2@2.36.18
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -Wall

[env:node_001]
extends = node
build_flags =
  ${node.build_flags}
  '-DNODE_CODE="NODE-001"'
  -DTX_OFFSET_MS=0

[env:node_002]
extends = node
build_flags =
  ${node.build_flags}
  '-DNODE_CODE="NODE-002"'
  -DTX_OFFSET_MS=10000

# One image for every tree. Deploy writes the node code at 0x670000.
# 20s so a freshly flashed board shows up on the gateway during a demo.
# The server can stretch that after the first accepted reading.
[env:field]
extends = node
build_flags =
  ${node.build_flags}
  '-DNODE_CODE="MAPLENODE00000000"'
  -DTX_INTERVAL_MS=20000
  -DTX_OFFSET_MS=0

# Same field image for the four-cell platform (four 50 kg half-bridge cells
# on one HX711). Run CAL once with a known weight after flashing.
[env:field_four_cell]
extends = node
build_flags =
  ${env:field.build_flags}
  -DLOAD_CELL_FOUR_HALF_BRIDGE

# Host unit tests for lib/maple_core (no board needed): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
