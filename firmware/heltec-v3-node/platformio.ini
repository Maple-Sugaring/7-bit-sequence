[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
monitor_filters = time, colorize
lib_deps =
  jgromes/RadioLib
  olikraus/U8g2

[env:node_001]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  '-DNODE_CODE="NODE-001"'
  -DTX_OFFSET_MS=0
  -DFILL_START_STEPS=0

[env:node_002]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  '-DNODE_CODE="NODE-002"'
  -DTX_OFFSET_MS=10000
  -DFILL_START_STEPS=16

# One image for every tree. Deploy writes the node code at 0x670000.
# 20s so a freshly flashed board shows up on the gateway during a demo.
# The server can stretch that after the first accepted reading.
[env:field]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  '-DNODE_CODE="MAPLENODE00000000"'
  -DTX_INTERVAL_MS=20000
  -DTX_OFFSET_MS=0
  -DFILL_START_STEPS=0
