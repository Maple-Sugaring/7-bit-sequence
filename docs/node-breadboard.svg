<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="640" fill="#f6f1e7"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#2b2b2b">Sap node breadboard: Heltec WiFi LoRa 32 V3 + HX711 + load cell</text>
  <text x="30" y="58" font-size="13" fill="#555">Source: firmware/heltec-v3-node/src/main.cpp (PIN_HX_DT = 6, PIN_HX_SCK = 7). Everything else is already on the Heltec board.</text>

  <!-- Breadboard -->
  <rect x="30" y="80" width="560" height="500" rx="10" fill="#e9e2d0" stroke="#b8ad90" stroke-width="2"/>
  <line x1="310" y1="92" x2="310" y2="568" stroke="#cfc6ac" stroke-width="10"/>
  <text x="310" y="574" font-size="10" fill="#8a8068" text-anchor="middle">centre channel</text>

  <!-- Heltec V3 -->
  <rect x="70" y="110" width="210" height="440" rx="8" fill="#1d3b53" stroke="#0f2233" stroke-width="2"/>
  <text x="175" y="140" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Heltec WiFi LoRa 32 V3</text>
  <text x="175" y="158" font-size="11" fill="#9fc2dc" text-anchor="middle">ESP32-S3 + SX1262</text>
  <rect x="100" y="175" width="150" height="62" rx="4" fill="#0b0b0b" stroke="#444"/>
  <text x="175" y="200" font-size="12" fill="#8fd3ff" text-anchor="middle">0.96" OLED (onboard)</text>
  <text x="175" y="218" font-size="10" fill="#8fd3ff" text-anchor="middle">GPIO 17 SDA / 18 SCL / 21 RST</text>
  <text x="175" y="268" font-size="11" fill="#cfe3f2" text-anchor="middle">SX1262 LoRa (onboard SPI)</text>
  <text x="175" y="283" font-size="10" fill="#9fc2dc" text-anchor="middle">GPIO 8 to 14, 915.125 MHz</text>
  <text x="175" y="312" font-size="11" fill="#cfe3f2" text-anchor="middle">PRG button = GPIO 0 (tare, hold 3 s)</text>
  <text x="175" y="330" font-size="11" fill="#cfe3f2" text-anchor="middle">LED GPIO 35 · Vext GPIO 36</text>
  <text x="175" y="348" font-size="11" fill="#cfe3f2" text-anchor="middle">Battery ADC GPIO 1 · enable GPIO 37</text>
  <text x="175" y="366" font-size="11" fill="#cfe3f2" text-anchor="middle">USB-C = CP2102 on UART0 (43/44)</text>

  <!-- used header pins -->
  <g font-size="12" font-weight="700" fill="#fff">
    <circle cx="280" cy="430" r="6" fill="#d9a441"/><text x="268" y="434" text-anchor="end">3V3</text>
    <circle cx="280" cy="460" r="6" fill="#d9a441"/><text x="268" y="464" text-anchor="end">GND</text>
    <circle cx="280" cy="490" r="6" fill="#d9a441"/><text x="268" y="494" text-anchor="end">GPIO 6</text>
    <circle cx="280" cy="520" r="6" fill="#d9a441"/><text x="268" y="524" text-anchor="end">GPIO 7</text>
  </g>

  <!-- Antenna -->
  <rect x="85" y="86" width="14" height="30" fill="#777"/>
  <text x="108" y="104" font-size="11" fill="#7a2d2d" font-weight="700">ANTENNA ON BEFORE POWER (22 dBm TX)</text>

  <!-- HX711 -->
  <rect x="380" y="320" width="190" height="200" rx="6" fill="#2f7d4f" stroke="#1d5233" stroke-width="2"/>
  <text x="475" y="345" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">HX711 module</text>
  <g font-size="12" font-weight="700" fill="#fff">
    <circle cx="380" cy="380" r="6" fill="#d9a441"/><text x="392" y="384">VCC</text>
    <circle cx="380" cy="410" r="6" fill="#d9a441"/><text x="392" y="414">GND</text>
    <circle cx="380" cy="440" r="6" fill="#d9a441"/><text x="392" y="444">DT</text>
    <circle cx="380" cy="470" r="6" fill="#d9a441"/><text x="392" y="474">SCK</text>
    <circle cx="570" cy="380" r="6" fill="#d9a441"/><text x="558" y="384" text-anchor="end">E+</text>
    <circle cx="570" cy="410" r="6" fill="#d9a441"/><text x="558" y="414" text-anchor="end">E-</text>
    <circle cx="570" cy="440" r="6" fill="#d9a441"/><text x="558" y="444" text-anchor="end">A+</text>
    <circle cx="570" cy="470" r="6" fill="#d9a441"/><text x="558" y="474" text-anchor="end">A-</text>
  </g>
  <text x="475" y="505" font-size="10" fill="#d6ecd9" text-anchor="middle">channel A, gain 128 (B+/B- unused)</text>

  <!-- Jumper wires: Heltec -> HX711 -->
  <path d="M280 430 C 330 430, 330 380, 380 380" stroke="#d62828" stroke-width="5" fill="none"/>
  <path d="M280 460 C 340 460, 330 410, 380 410" stroke="#222" stroke-width="5" fill="none"/>
  <path d="M280 490 C 340 490, 330 440, 380 440" stroke="#1d6fd6" stroke-width="5" fill="none"/>
  <path d="M280 520 C 340 520, 330 470, 380 470" stroke="#e6b800" stroke-width="5" fill="none"/>

  <!-- Load cell -->
  <rect x="680" y="300" width="250" height="80" rx="6" fill="#b9bec4" stroke="#6b7076" stroke-width="2"/>
  <circle cx="720" cy="340" r="10" fill="#8d9298"/><circle cx="890" cy="340" r="10" fill="#8d9298"/>
  <text x="805" y="336" font-size="13" font-weight="700" fill="#222" text-anchor="middle">Load cell</text>
  <text x="805" y="354" font-size="11" fill="#333" text-anchor="middle">Guang Ce YZC-1B · 50 kg · 2.0 mV/V</text>
  <text x="805" y="396" font-size="10" fill="#555" text-anchor="middle">fixed end on frame, free end under the bucket platform</text>

  <!-- load cell wires -->
  <path d="M570 380 C 620 380, 640 470, 700 470 L 760 470" stroke="#d62828" stroke-width="4" fill="none"/>
  <path d="M570 410 C 610 410, 630 490, 700 490 L 760 490" stroke="#222" stroke-width="4" fill="none"/>
  <path d="M570 440 C 600 440, 620 510, 700 510 L 760 510" stroke="#2f9e44" stroke-width="4" fill="none"/>
  <path d="M570 470 C 590 470, 610 530, 700 530 L 760 530" stroke="#eee" stroke-width="4" fill="none"/>
  <path d="M570 470 C 590 470, 610 530, 700 530 L 760 530" stroke="#999" stroke-width="1" fill="none"/>
  <g font-size="12" fill="#222">
    <text x="770" y="474">Red = E+</text>
    <text x="770" y="494">Black = E-</text>
    <text x="770" y="514">Green = signal +  (A+)</text>
    <text x="770" y="534">White = signal -  (A-)</text>
  </g>

  <!-- Notes -->
  <g font-size="12" fill="#2b2b2b">
    <text x="620" y="570" font-size="12" font-weight="700">Notes</text>
  </g>
  <g font-size="11" fill="#444">
    <text x="620" y="588">· Power HX711 from 3V3 so DT stays 3.3 V safe.</text>
    <text x="620" y="603">· Verify cell colours on your datasheet. If weight reads</text>
    <text x="620" y="617">  negative ("reversed" fault), swap the green and white wires.</text>
  </g>
</svg>
